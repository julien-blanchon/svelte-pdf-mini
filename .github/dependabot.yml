version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      svelte:
        patterns: ['svelte', 'svelte-check', '@sveltejs/*']
      pdf:
        patterns: ['pdfjs-dist', '@cantoo/pdf-lib']
      dev:
        dependency-type: development
