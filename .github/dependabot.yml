version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # svelte-check, @sveltejs/package and typescript-eslint support TypeScript ≤ 6 for now.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      svelte:
        patterns: ['svelte', 'svelte-check', '@sveltejs/*']
      pdf:
        patterns: ['pdfjs-dist', '@cantoo/pdf-lib']
      dev:
        dependency-type: development
