name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal snippet, a link to a repository or Svelte playground, and the PDF if it matters (an arXiv link is ideal).
      render: svelte
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: svelte-pdf-mini version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, OS and Svelte version
      placeholder: Chrome 140, macOS 26, svelte 5.57
