name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Lint (ESLint + Prettier, library)
        run: bun run lint

      - name: Type check (library + docs)
        run: bun run check

      - name: Build the library (svelte-package + publint)
        run: bun --filter svelte-pdf-mini build

      # arXiv PDFs used by the unit tests (not committed).
      - uses: actions/cache@v6
        with:
          path: fixtures/cache
          key: fixtures-${{ hashFiles('fixtures/papers.json') }}
      - run: bun run fixtures

      - name: Install Chromium (vitest browser project)
        run: bunx playwright install --with-deps chromium
      - name: Unit tests (fast + slow)
        run: bun run test:full

      - name: Build the docs (GitHub Pages base path)
        run: bun --filter docs build
        env:
          BASE_PATH: /svelte-pdf-mini

  e2e:
    name: End-to-end (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Smoke tests against the dev server
        run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/docs/test-results
            apps/docs/playwright-report
          retention-days: 7

  changeset:
    name: Changeset
    # Library changes in a pull request should come with a changeset (`bun changeset`),
    # so they end up in the changelog. Not needed for docs-only changes.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Library changes have a changeset
        run: bunx changeset status --since=origin/${{ github.base_ref }}
