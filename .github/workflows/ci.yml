name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: Lint (ESLint + Prettier, library)
        run: bun run lint

      - name: Unused files, exports and dependencies (knip)
        run: bunx knip

      - name: Type check (library + docs)
        run: bun run check

      - name: Build the library (svelte-package + publint)
        run: bun --filter svelte-pdf-mini build

      # arXiv PDFs used by the unit tests (not committed).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fixtures/cache
          key: fixtures-${{ hashFiles('fixtures/papers.json') }}
      - run: bun run fixtures

      # Chromium for the vitest browser project and the e2e smoke tests: one install,
      # cached per Playwright version (the system libraries it needs are not cached).
      # Run from apps/docs so `bunx` uses the locked Playwright, not the latest.
      - name: Playwright version
        id: playwright
        working-directory: apps/docs
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        working-directory: apps/docs
        run: bunx playwright install --with-deps chromium
      - name: Install Chromium's system dependencies
        if: steps.chromium.outputs.cache-hit == 'true'
        working-directory: apps/docs
        run: bunx playwright install-deps chromium

      - name: Unit tests (fast + slow)
        run: bun run test:full

      - name: End-to-end smoke tests (against the dev server)
        run: bun run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/docs/test-results
            apps/docs/playwright-report
          retention-days: 7

      - name: Build the docs (GitHub Pages base path)
        run: bun --filter docs build
        env:
          BASE_PATH: /svelte-pdf-mini

  changeset:
    name: Changeset
    # Library changes in a pull request should come with a changeset (`bun changeset`),
    # so they end up in the changelog. Not needed for docs-only changes.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Library changes have a changeset
        run: bunx changeset status --since=origin/${{ github.base_ref }}
